<!DOCTYPE html>
<html>
<head>

<title>About School</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>About Our School</h2>

<h2 id="aboutTitle"></h2>

<p id="aboutDescription"></p>

<img id="aboutImage" class="img-fluid rounded mt-3">

</div>

<script>

async function loadAbout(){

const res = await fetch("http://localhost:5000/api/about")
const data = await res.json()

if(data){

document.getElementById("aboutTitle").innerText = data.title || ""

document.getElementById("aboutDescription").innerText = data.description || ""

if(data.image){
document.getElementById("aboutImage").src =
"http://localhost:5000/uploads/" + data.image
}

}

}

loadAbout()

</script>

</body>
</html>
