<!DOCTYPE html>
<html>
<head>

<title>Downloads</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fb;
font-family:Arial;
}

.navbar{
background:#1e3a5f;
}

.navbar a{
color:white !important;
}

.section{
padding:60px 0;
}

.download-card{
background:white;
padding:15px;
border-radius:6px;
margin-bottom:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

</style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand text-white" href="index.html">
School Website
</a>

<div>

<a class="nav-link d-inline text-white" href="index.html">Home</a>
<a class="nav-link d-inline text-white" href="downloads.html">Downloads</a>

</div>

</div>

</nav>



<!-- DOWNLOADS -->

<div class="container section">

<h2 class="mb-4">Downloads</h2>

<div id="downloadList"></div>

</div>



<script>

async function loadDownloads(){

const res = await fetch("http://localhost:5000/api/downloads")
const data = await res.json()

let html=""

data.forEach(d=>{

html+=`

<div class="download-card">

<b>${d.title}</b>

<a href="http://localhost:5000/uploads/${d.file}" download class="btn btn-primary btn-sm float-end">

Download

</a>

</div>

`

})

document.getElementById("downloadList").innerHTML=html

}

loadDownloads()

</script>

</body>
</html>
