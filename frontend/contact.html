<!DOCTYPE html>
<html>
<head>

<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fb;
font-family:Arial;
}

.navbar{
background:#1e3a5f;
}

.navbar a{
color:white !important;
}

.section{
padding:60px 0;
}

.contact-box{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

</style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand text-white" href="index.html">
School Website
</a>

<div>

<a class="nav-link d-inline text-white" href="index.html">Home</a>
<a class="nav-link d-inline text-white" href="gallery.html">Gallery</a>
<a class="nav-link d-inline text-white" href="downloads.html">Downloads</a>
<a class="nav-link d-inline text-white" href="contact.html">Contact</a>

</div>

</div>

</nav>


<!-- CONTACT -->

<div class="container section">

<h2 class="mb-4">Contact Us</h2>

<div class="row">

<div class="col-md-6">

<div class="contact-box">

<input id="name" class="form-control mb-3" placeholder="Your Name">

<input id="email" class="form-control mb-3" placeholder="Email">

<textarea id="message" class="form-control mb-3" placeholder="Message"></textarea>

<button onclick="sendMessage()" class="btn btn-primary">Send Message</button>

<p id="status" class="mt-3 text-success"></p>

</div>

</div>

</div>

</div>


<script>

async function sendMessage(){

const name=document.getElementById("name").value
const email=document.getElementById("email").value
const message=document.getElementById("message").value

await fetch("/api/contact/send",{

method:"POST",
headers:{"Content-Type":"application/json"},

body:JSON.stringify({

name:name,
email:email,
message:message

})

})

document.getElementById("status").innerText="Message sent successfully"

document.getElementById("name").value=""
document.getElementById("email").value=""
document.getElementById("message").value=""

}

</script>

</body>
</html>
